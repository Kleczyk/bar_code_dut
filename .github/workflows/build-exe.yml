name: Build Windows EXE

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Python dependencies
        working-directory: packaging
        run: |
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Install frontend dependencies
        working-directory: app/frontend
        run: npm install

      - name: Build frontend
        working-directory: app/frontend
        run: npm run build

      - name: Build EXE with PyInstaller
        working-directory: packaging
        run: pyinstaller --noconfirm pyinstaller.spec

      - name: Verify bundled fonts
        working-directory: packaging
        shell: pwsh
        run: |
          Write-Host "Checking PyInstaller output for bundled fonts..."
          $fontsDir = "dist\GeneratorIdentyfikatorow\_internal\fonts"
          if (Test-Path "dist\GeneratorIdentyfikatorow.exe") {
            Write-Host "One-file mode detected, extracting to check..."
            $proc = Start-Process -FilePath "dist\GeneratorIdentyfikatorow.exe" -PassThru -RedirectStandardOutput "exe_stdout.log" -RedirectStandardError "exe_stderr.log"
            Start-Sleep -Seconds 15
            Stop-Process -Id $proc.Id -Force -ErrorAction SilentlyContinue
            Write-Host "=== EXE stdout ==="
            if (Test-Path "exe_stdout.log") { Get-Content "exe_stdout.log" }
            Write-Host "=== EXE stderr ==="
            if (Test-Path "exe_stderr.log") { Get-Content "exe_stderr.log" }
          }

      - name: Smoke test EXE
        working-directory: packaging
        shell: pwsh
        run: |
          Write-Host "Starting EXE for smoke test..."
          $proc = Start-Process -FilePath "dist\GeneratorIdentyfikatorow.exe" -PassThru
          Write-Host "EXE started, PID: $($proc.Id)"
          Start-Sleep -Seconds 15
          $maxAttempts = 20
          $success = $false
          for ($i = 0; $i -lt $maxAttempts; $i++) {
            try {
              $response = Invoke-WebRequest -Uri "http://127.0.0.1:8000" -UseBasicParsing -TimeoutSec 3
              if ($response.StatusCode -eq 200) {
                Write-Host "Smoke test PASSED: HTTP 200 from server"
                $success = $true
                break
              }
            } catch {
              Write-Host "Attempt $($i+1)/$maxAttempts - waiting..."
              Start-Sleep -Seconds 2
            }
          }
          Stop-Process -Id $proc.Id -Force -ErrorAction SilentlyContinue
          if (-not $success) {
            Write-Host "Smoke test FAILED: server did not respond"
            exit 1
          }

      - name: Upload EXE as artifact
        uses: actions/upload-artifact@v4
        with:
          name: GeneratorIdentyfikatorow
          path: |
            packaging/dist/GeneratorIdentyfikatorow.exe
            packaging/odinstaluj.bat
          retention-days: 30

      - name: Create Release (on tag push)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            packaging/dist/GeneratorIdentyfikatorow.exe
            packaging/odinstaluj.bat
          generate_release_notes: true
